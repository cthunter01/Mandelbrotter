# Builds and tests the CI presets on Linux, macOS, Windows and FreeBSD, and checks formatting.
# Linux runs in an Arch Linux container so CI has the same current GCC/Clang as the dev machine.
# wxWidgets is built from source (statically) inside each preset's build tree; ccache is persisted between runs
# so that only the first run of a preset pays for it.
name: CI

on:
  push:
  pull_request:
  workflow_call:   # the Release workflow runs all of CI before it tags

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPILERCHECK: content   # runner images and pacman -Syu update compilers; hash the binary, not its mtime

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, asan, tidy, headless]   # headless: the build without a window (no wx)
    steps:
      - name: Install toolchain and wxWidgets build dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja clang git ccache pkgconf gtk3 libpng zlib
      - uses: actions/checkout@v7
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.preset }}-
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: ccache -sv

  # Apple Clang from the runner's default Xcode. wxWidgets builds on Cocoa, so it needs no extra libraries.
  # No asan here: Apple's AddressSanitizer runtime has no leak detection, and the sanitized code (core library
  # and CLI) has no platform-specific paths, so the Linux asan job already covers it.
  macos:
    name: macos / ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - name: Install Ninja and ccache
        run: brew install ninja ccache
      - uses: actions/checkout@v7
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-macos-${{ matrix.preset }}-
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Compiler cache statistics
        run: ccache -sv

  # MSVC from the runner's Visual Studio; the local msvc-dev-env action sets up the Developer PowerShell
  # environment (release.yml uses it too, so every CI run checks it).
  windows:
    name: windows / ci-msvc
    runs-on: windows-latest
    steps:
      - name: Install ccache
        run: choco install ccache --no-progress
      - uses: actions/checkout@v7
      - uses: ./.github/actions/msvc-dev-env
      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-ci-msvc-${{ github.run_id }}
          restore-keys: ccache-windows-ci-msvc-
      - name: Configure, build and test
        run: cmake --workflow --preset ci-msvc
      - name: Compiler cache statistics
        run: ccache -sv

  # GitHub has no FreeBSD runner, so this boots a FreeBSD VM on the Linux one and runs the preset inside it.
  # The compiler is the base system's Clang with libc++. 14.5 has Clang 21; the 15.x releases so far (15.0 and
  # 15.1) still have libc++ 19, which lacks std::from_chars for floating point and std::jthread. wxWidgets builds
  # on GTK 3, as on Linux. No ccache: the VM starts from the same image every run, so every run compiles wxWidgets.
  freebsd:
    name: freebsd / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - uses: actions/checkout@v7
      - name: Configure, build and test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          copyback: false   # nothing built in the VM is needed on the runner afterwards
          prepare: pkg install -y cmake-core ninja git-lite pkgconf gtk3 png
          run: cmake --workflow --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
