# Cuts a release when run by hand (never on a push): Actions > Release > Run workflow, or
#     gh workflow run release.yml [-f prerelease=true] [--ref <branch>]
# The version is project(VERSION) in CMakeLists.txt: raise it and push before running this.
# Runs all of CI and builds the dist-linux, dist-macos and dist-windows archives (CMakePresets.json). Only when
# all of that passes does it tag the commit v<version> and publish a GitHub release with the archives and a
# SHA256SUMS file.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: read

concurrency: release

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Read project(VERSION) and check its tag is new
        id: version
        run: |
          version=$(sed -nE 's/^[[:space:]]*project\([[:alnum:]_]+[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ -z $version ]]; then
            echo "::error file=CMakeLists.txt::found no 'project(<name> VERSION x.y.z' line"
            exit 1
          fi
          tag=v$version
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error file=CMakeLists.txt::$tag already exists; raise VERSION in project() and push first"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_REF_NAME at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: build / ${{ matrix.preset }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # A pinned image, not ubuntu-latest: the executable needs at least the glibc it was built against
          # (2.39 here), so a newer image would silently drop older distributions. Also not the Arch container
          # ci.yml uses: Arch's rolling glibc is newer still and would make the archive even less portable.
          - { preset: dist-linux, runner: ubuntu-24.04 }
          - { preset: dist-macos, runner: macos-latest }
          - { preset: dist-windows, runner: windows-latest }
    steps:
      # Clang 22 comes from LLVM's own apt repository: Ubuntu 24.04's Clang 18 is too old for this code (its
      # __cpp_concepts is still 201907L, so libstdc++'s <expected> defines nothing). Clang still compiles
      # against GCC's libstdc++, which is linked into the executable; g++-14 is installed only for that
      # libstdc++ (Ubuntu 24.04's default GCC 13's has no <print>), and --gcc-install-dir pins it so the build
      # does not depend on which GCC installation Clang would pick.
      - name: Install Clang 22, g++ 14 and wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/keyrings/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.asc] https://apt.llvm.org/$VERSION_CODENAME/ llvm-toolchain-$VERSION_CODENAME-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 g++-14 ninja-build libgtk-3-dev pkg-config
          sudo ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
          echo "CXXFLAGS=--gcc-install-dir=$(dirname "$(g++-14 -print-libgcc-file-name)")" >> "$GITHUB_ENV"
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/checkout@v7
      - name: Configure, build, test and package
        run: cmake --workflow --preset ${{ matrix.preset }}
      # The tests ran the build tree's bundle; check the packaged one, as users get it.
      - name: Check the packaged macOS app
        if: runner.os == 'macOS'
        run: |
          tar -xzf build/${{ matrix.preset }}/package/*.tar.gz -C "$RUNNER_TEMP"
          app=$(echo "$RUNNER_TEMP"/Mandelbrotter-*/Mandelbrotter.app)
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/Mandelbrotter" --render "$RUNNER_TEMP/smoke.png" --size 64x40
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/package/*.tar.gz
            build/${{ matrix.preset }}/package/*.zip
          if-no-files-found: error

  release:
    name: release
    needs: [version, ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Tag ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          url=$(gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
                --prerelease="$PRERELEASE" -- *)
          echo "Published $url" >> "$GITHUB_STEP_SUMMARY"
